[package]
name = "agy-statusline"
version = "0.1.0"
edition = "2024"
authors = ["yesvus <yesvus@gmail.com>"]
description = "Fast, zero-CPU custom statusline for Google Antigravity (agy)"
license = "MIT"
repository = "https://github.com/yesvus/agy-statusline"

[dependencies]
chrono = "0.4.45"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
